# Belebele English (eng_Latn) with deterministic option shuffle.
task: tinyace_belebele_eng
dataset_path: facebook/belebele
dataset_name: eng_Latn
test_split: test
# No fewshot_split, deliberately. Belebele ships only a `test` split, so the
# only thing it could point at is the split the study reports over -- and with
# `sampler: first_n` a few-shot run would deterministically draw its
# demonstrations from the first documents of the frozen evaluation set.
#
# It is inert while every run is 0-shot, which is why it survived this long.
# The planned `icl_matched_budget` arm is what turns it live, so the source is
# removed now: an ICL arm must pass its own demonstrations from the adaptation
# split rather than inherit them from here.
output_type: multiple_choice
process_docs: !function utils.process_docs
doc_to_text: "P: {{flores_passage}}\nQ: {{question.strip()}}\nA: {{mc_answer1}}\nB: {{mc_answer2}}\nC: {{mc_answer3}}\nD: {{mc_answer4}}\nAnswer:"
doc_to_choice: ["A", "B", "C", "D"]
doc_to_target: "{{gold_option_idx}}"
should_decontaminate: true
doc_to_decontamination_query: "{{question}}"
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
  - metric: acc_norm
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
